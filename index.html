<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter" errors
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if restricted
        }
      })();
    </script>
